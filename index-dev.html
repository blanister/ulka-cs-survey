<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17212b"><title>ULKA | Customer Satisfaction DEV</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--ink:#17212b;--muted:#687582;--line:#e5e9ed;--accent:#d7a94b;--paper:#fff;--bg:#f3f5f6;--success:#18794e;--danger:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:26px 16px;background:radial-gradient(circle at top,#263744 0,#101820 340px,#f3f5f6 341px);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Tahoma,sans-serif}.wrap{max-width:560px;margin:auto}.brand{text-align:center;color:#fff;margin:8px 0 22px}.brand-mark{font-size:31px;font-weight:800;letter-spacing:.22em}.brand-sub{margin-top:5px;color:#d7dee3;font-size:11px;letter-spacing:.2em}.dev{display:inline-block;margin-top:9px;padding:4px 9px;border-radius:20px;background:#f5c451;color:#3d2c00;font-size:10px;font-weight:800;letter-spacing:1px}.card{background:var(--paper);border-radius:22px;padding:26px;box-shadow:0 18px 55px #0002}h1{margin:0;text-align:center;font-size:23px}.intro{text-align:center;color:var(--muted);font-size:14px;line-height:1.65;margin:9px 0 22px}.field-label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.customer,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:14px;background:#f8fafb;color:var(--ink)}.question{padding:18px 0;border-top:1px solid var(--line)}.qtitle{font-size:15px;font-weight:750;margin-bottom:6px}.hint{font-size:12px;color:var(--muted);margin-bottom:12px}.ratings{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.rating{border:1px solid var(--line);background:white;border-radius:11px;min-height:52px;cursor:pointer;font:inherit;color:var(--ink)}.rating.active{border-color:var(--accent);background:#fff8e9;box-shadow:0 0 0 2px #d7a94b2b}.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:7px}.comment-label{display:block;font-size:14px;font-weight:700;margin:20px 0 8px}textarea{min-height:95px;resize:vertical;background:white}.submit{width:100%;border:0;border-radius:13px;padding:15px;margin-top:20px;background:var(--ink);color:white;font:inherit;font-weight:750;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}#result{display:none;margin-top:15px;padding:13px;border-radius:12px;font-size:13px;line-height:1.6}#result.info{display:block;background:#edf4ff;color:#24549a}#result.success{display:block;background:#eaf6ef;color:var(--success)}#result.error{display:block;background:#fff0ee;color:var(--danger)}.foot{text-align:center;color:#d7dee3;font-size:11px;margin-top:18px}@media(max-width:420px){.card{padding:21px 17px}.ratings{gap:5px}.rating{min-height:48px}}
</style></head><body><main class="wrap"><header class="brand"><div class="brand-mark">ULKA</div><div class="brand-sub">CUSTOMER EXPERIENCE</div><div class="dev">DEVELOPMENT ENVIRONMENT</div></header><section class="card"><h1 id="formTitle">แบบประเมินความพึงพอใจ</h1><p class="intro">ขอบคุณที่ใช้บริการ ULKA<br>ความคิดเห็นของคุณช่วยให้เราพัฒนาการบริการให้ดียิ่งขึ้นค่ะ</p><label class="field-label" for="customerName">ชื่อผู้ประเมิน</label><input class="customer" id="customerName" readonly placeholder="กำลังโหลดข้อมูลจาก LINE..."><div id="questions"><div class="hint">กำลังโหลดแบบประเมิน...</div></div><label class="comment-label" for="comment">ข้อเสนอแนะเพิ่มเติม (ถ้ามี)</label><textarea id="comment" placeholder="บอกเราเพิ่มเติมได้เลยค่ะ"></textarea><button id="submit" class="submit" disabled>ส่งผลการประเมิน →</button><div id="result" role="status" aria-live="polite"></div></section><footer class="foot">ULKA · DEV · Thank you for your feedback</footer></main>
<script>
(() => {
'use strict';
const API_URL='PASTE_DEV_WEB_APP_URL_HERE';
const LIFF_ID='PASTE_DEV_LIFF_ID_HERE';
let staffToken='',lineUserId='',formData=null,busy=false;
const $=id=>document.getElementById(id);
function show(message,type='info'){const el=$('result');el.textContent=message;el.className=type;}
function requestId(){const a=new Uint8Array(32);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');}
function jsonp(req,timeout=12000){return new Promise((resolve,reject)=>{const cb='ulka_'+requestId().slice(0,18),s=document.createElement('script');let done=false;const timer=setTimeout(()=>finish(Error('หมดเวลารอเซิร์ฟเวอร์')),timeout);function finish(err,val){if(done)return;done=true;clearTimeout(timer);delete window[cb];s.remove();err?reject(err):resolve(val);}window[cb]=v=>finish(null,v);s.onerror=()=>finish(Error('เชื่อมต่อ DEV API ไม่สำเร็จ'));s.src=API_URL+'?action=admin_result&requestId='+encodeURIComponent(req)+'&callback='+cb+'&_='+Date.now();document.head.appendChild(s);});}
async function api(action,extra={}){if(!API_URL.startsWith('https://script.google.com/macros/s/')||API_URL.includes('PASTE_'))throw Error('ยังไม่ได้ตั้งค่า DEV Web App URL');const req=requestId();await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,requestId:req,...extra})});const end=Date.now()+100000;while(Date.now()<end){await new Promise(r=>setTimeout(r,1000));const out=await jsonp(req);if(out?.pending)continue;return out;}throw Error('เซิร์ฟเวอร์ใช้เวลาตอบกลับนานเกินไป');}
function renderForm(form){formData=form;$('formTitle').textContent=form.formName||'แบบประเมินความพึงพอใจ';const root=$('questions');root.innerHTML='';form.questions.forEach((q,index)=>{const section=document.createElement('section');section.className='question';const title=document.createElement('div');title.className='qtitle';title.textContent=(index+1)+'. '+q.questionText+(q.required?' *':'');section.append(title);if(q.description){const hint=document.createElement('div');hint.className='hint';hint.textContent=q.description;section.append(hint);}const ratings=document.createElement('div');ratings.className='ratings';ratings.dataset.questionId=q.questionId;const min=Number(q.scaleMin||1),max=Number(q.scaleMax||5);for(let score=min;score<=max;score++){const b=document.createElement('button');b.type='button';b.className='rating';b.textContent=String(score);b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{ratings.querySelectorAll('button').forEach(x=>{const active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-pressed',String(active));});ratings.dataset.value=String(score);});ratings.append(b);}section.append(ratings);const scale=document.createElement('div');scale.className='scale';const lo=document.createElement('span'),hi=document.createElement('span');lo.textContent=q.minLabel||'ควรปรับปรุง';hi.textContent=q.maxLabel||'ดีเยี่ยม';scale.append(lo,hi);section.append(scale);root.append(section);});$('submit').disabled=false;}
function surveyId(){const a=crypto.getRandomValues(new Uint8Array(6));return 'SV-'+Array.from(a,x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();}
async function boot(){try{if(LIFF_ID.includes('PASTE_'))throw Error('ยังไม่ได้สร้าง DEV LIFF App และกำหนด LIFF ID');await liff.init({liffId:LIFF_ID});const params=new URLSearchParams(location.search);staffToken=params.get('token')||'';if(!staffToken)throw Error('ไม่พบ Staff Token ในลิงก์');if(!liff.isLoggedIn())throw Error('กรุณาเปิดแบบประเมินผ่าน LINE และเข้าสู่ระบบ');const profile=await liff.getProfile();lineUserId=profile.userId||'';$('customerName').value=profile.displayName||'';if(!lineUserId||!$('customerName').value)throw Error('ไม่พบข้อมูลโปรไฟล์ LINE');const result=await api('survey_get_form',{staffToken});if(!result?.success||!result.form)throw Error(result?.message||'โหลดแบบประเมินไม่สำเร็จ');renderForm(result.form);show('โหลดแบบประเมินเรียบร้อยแล้ว','success');}catch(e){show(e.message||'เกิดข้อผิดพลาด','error');$('questions').innerHTML='';$('submit').disabled=true;}}
async function submit(){if(busy)return;if(!formData||!staffToken||!lineUserId)return show('ข้อมูลแบบประเมินไม่ครบ กรุณาโหลดหน้าใหม่','error');const answers={};for(const q of formData.questions){const el=document.querySelector('[data-question-id="'+CSS.escape(q.questionId)+'"]');const value=el?.dataset.value||'';if(q.required&&!value){show('กรุณาตอบคำถาม: '+q.questionText,'error');return;}if(value)answers[q.questionId]=Number(value);}busy=true;const btn=$('submit');btn.disabled=true;btn.textContent='กำลังส่งผลการประเมิน...';try{const out=await api('survey_submit_dynamic',{staffToken,surveyId:surveyId(),customerName:$('customerName').value.trim(),platform:'LINE',platformUserId:lineUserId,formId:formData.formId,formVersion:formData.formVersion,answers,comment:$('comment').value.trim()});if(!out?.success)throw Error(out?.message||'บันทึกผลประเมินไม่สำเร็จ');show('บันทึกผลประเมินเรียบร้อยแล้วค่ะ ขอบคุณที่ใช้บริการ ULKA ❤️','success');btn.textContent='บันทึกเรียบร้อยแล้ว';}catch(e){show(e.message||'ไม่สามารถบันทึกผลประเมินได้','error');btn.disabled=false;btn.textContent='ส่งผลการประเมิน →';busy=false;}}
$('submit').addEventListener('click',submit);boot();
})();
</script></body></html>
